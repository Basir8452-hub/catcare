name: Build Android APK

# 手动触发：避免每次提交网页改动都跑一次构建。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packaging/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 同步网页资源到 www/
        run: node scripts/sync-web.mjs

      - name: Capacitor sync
        run: npx cap sync android

      - name: 构建未签名 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: packaging/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
